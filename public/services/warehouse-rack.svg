<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="50%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="200" fill="url(#accent)" opacity="0.06"/>
  <g transform="translate(400,300)" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="-90" y="-50" width="180" height="100" rx="4"/>
    <line x1="-90" y1="-10" x2="90" y2="-10" stroke-width="2" opacity="0.5"/>
    <line x1="-90" y1="30" x2="90" y2="30" stroke-width="2" opacity="0.5"/>
    <line x1="-30" y1="-50" x2="-30" y2="50" stroke-width="1.5" opacity="0.4"/>
    <line x1="30" y1="-50" x2="30" y2="50" stroke-width="1.5" opacity="0.4"/>
    <rect x="-20" y="-42" width="35" height="25" rx="2" fill="url(#accent)" opacity="0.08"/>
    <rect x="-20" y="-2" width="40" height="25" rx="2" fill="url(#accent)" opacity="0.08"/>
    <rect x="-20" y="36" width="30" height="10" rx="2" fill="url(#accent)" opacity="0.08"/>
  </g>
</svg>
