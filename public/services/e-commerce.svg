<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="50%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="200" fill="url(#accent)" opacity="0.06"/>
  <g transform="translate(400,300)" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M-70 -40 L-60 -25 L-40 40 L50 40 L70 -10 L-50 -10"/>
    <circle cx="-25" cy="50" r="8" fill="url(#accent)" opacity="0.3"/>
    <circle cx="35" cy="50" r="8" fill="url(#accent)" opacity="0.3"/>
    <rect x="-35" y="-40" width="30" height="20" rx="2" opacity="0.4"/>
    <line x1="-20" y1="-35" x2="-10" y2="-35" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>
