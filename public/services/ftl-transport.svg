<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="50%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="200" fill="url(#accent)" opacity="0.06"/>
  <g transform="translate(400,300)" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="-120" y="-50" width="180" height="80" rx="4"/>
    <rect x="60" y="-60" width="100" height="90" rx="4"/>
    <path d="M-120 30 L-120 50 L-100 50"/>
    <path d="M60 30 L60 50 L80 50"/>
    <circle cx="-60" cy="50" r="14" fill="url(#accent)" opacity="0.3"/>
    <circle cx="80" cy="50" r="14" fill="url(#accent)" opacity="0.3"/>
    <line x1="-40" y1="-10" x2="40" y2="-10" stroke-width="2" opacity="0.4"/>
    <line x1="-40" y1="10" x2="40" y2="10" stroke-width="2" opacity="0.4"/>
    <line x1="-40" y1="30" x2="20" y2="30" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
