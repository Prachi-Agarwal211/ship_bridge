<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="50%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="200" fill="url(#accent)" opacity="0.06"/>
  <g transform="translate(400,300)" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <line x1="0" y1="-60" x2="0" y2="60"/>
    <line x1="-60" y1="60" x2="60" y2="60" stroke-width="3"/>
    <path d="M-30 -60 L30 -60 L30 -40" stroke-width="2"/>
    <rect x="-40" y="10" width="80" height="35" rx="3" fill="url(#accent)" opacity="0.08"/>
    <rect x="-45" y="20" width="10" height="15" rx="1" fill="url(#accent)" opacity="0.2"/>
    <circle cx="0" cy="-60" r="6" fill="url(#accent)" opacity="0.4"/>
    <line x1="-30" y1="-60" x2="-30" y2="-20" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>
